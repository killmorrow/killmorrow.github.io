<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>diário livros</title>
  <link rel="stylesheet" href="livros/style.css">
</head>

<body>

  <div class="layout-principal">

    <main class="coluna-esquerda">

      <h1>📚 diário de livros<span class="blink">_</span></h1>

      <nav id="nav-anos" class="nav-anos"></nav>

      <div id="container-dos-livros"></div>

    </main>

    <aside class="coluna-direita">

      <h2 class="blink">meus favs!!</h2>

      <div class="favoritos-grid">

        <div class="fav-card">
          <img
            src="https://books.google.com/books/content?id=EXEMPLO1&printsec=frontcover&img=1&zoom=2"
            alt="Favorito 1"
          >
        </div>

        <div class="fav-card">
          <img
            src="https://books.google.com/books/content?id=EXEMPLO2&printsec=frontcover&img=1&zoom=2"
            alt="Favorito 2"
          >
        </div>

        <div class="fav-card">
          <img
            src="https://books.google.com/books/content?id=EXEMPLO3&printsec=frontcover&img=1&zoom=2"
            alt="Favorito 3"
          >
        </div>

        <div class="fav-card">
          <img
            src="https://books.google.com/books/content?id=EXEMPLO4&printsec=frontcover&img=1&zoom=2"
            alt="Favorito 4"
          >
        </div>

      </div>

      <button id="btn-topo" class="btn-topo">
        ↑ voltar ao topo
      </button>

    </aside>

  </div>

  <script src="livros/script.js"></script>
  <script src="../script.js" defer></script>

</body>
</html>
