<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>diario jogos</title>
  <link rel="stylesheet" href="jogos/style.css">
</head>
<body>

  <!-- Contêiner que divide a tela em esquerda e direita -->
  <div class="layout-principal">
    
    <!-- COLUNA ESQUERDA (Diário e Anos) -->
    <main class="coluna-esquerda">
      <h1>🎬 diário de jogos<span class="blink">_</span></h1>
      
      <!-- Onde os botões de anos vão aparecer -->
      <nav id="nav-anos" class="nav-anos"></nav>

      <!-- Onde as reviews vão aparecer -->
      <div id="container-dos-jogos"></div>
    </main>

    <!-- COLUNA DIREITA (Favoritos) -->
    <aside class="coluna-direita">
      <h2 class="blink">meus favs!!</h2>
      
      <!-- Substitua os links abaixo pelas URLs reais dos pôsteres dos seus favoritos -->
      <div class="favoritos-grid">
        <div class="fav-card"><img src="https://media.rawg.io/media/resize/1920/-/screenshots/5b6/5b6b05a756adbdf93c38cfcf9c0bbb42.jpg" alt="Favorito 1"></div>
        <div class="fav-card"><img src="https://media.rawg.io/media/resize/1920/-/screenshots/3d8/3d8456e76b19ed821103e86261dadb2b.jpg" alt="Favorito 2"></div>
        <div class="fav-card"><img src="https://media.rawg.io/media/games/0af/0afe9e8ace196123d8c7cf22172cec63.jpg" alt="Favorito 3"></div>
        <div class="fav-card"><img src="https://media.rawg.io/media/games/ba1/ba1bf58929130f56be870b6217746aed.jpg" alt="Favorito 4"></div>
      </div>
      
      <button id="btn-topo" class="btn-topo">↑ voltar ao topo</button>
    </aside>

  </div>

  <script src="jogos/script.js"></script>
  <script src="../script.js" defer></script>
</body>
</html>
